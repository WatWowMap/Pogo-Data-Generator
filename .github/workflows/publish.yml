name: Publish

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  build:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn

      - name: Test
        run: yarn test

  publish-npm:
    needs: build
    name: Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      # setup-node's registry-url writes an .npmrc referencing ${NODE_AUTH_TOKEN}.
      # Publishing is done via OIDC, so no such token exists, and yarn v1 aborts
      # on an env var it cannot expand. npm itself treats the empty value as no
      # auth and falls through to trusted publishing.
      - run: yarn
        env:
          NODE_AUTH_TOKEN: ''
      - run: ./node_modules/.bin/tsc
      - run: npm publish
